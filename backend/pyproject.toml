[project]
name = "thesis-assistant-backend"
version = "0.1.0"
description = "Local-first, source-grounded thesis assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "chromadb>=0.5,<2",
  "ollama>=0.3,<1",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "tiktoken>=0.8,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
